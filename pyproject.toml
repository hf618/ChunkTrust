[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chunktrust"
version = "0.1.0"
description = "Execution horizon adaptation from action-expert evidence"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.4,<2.5"]
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[project.scripts]
chunktrust = "chunktrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/chunktrust/third_party" = [
    "third_party/NOTICE.md",
    "third_party/upstreams.json",
    "third_party/source_manifest.json",
    "third_party/portability_changes.json",
    "third_party/robodriver_sources.json",
    "third_party/agilex_openpi_sources.json",
]
"share/chunktrust/third_party/licenses" = ["third_party/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
